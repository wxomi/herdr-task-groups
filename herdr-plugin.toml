id = "wxomi.task-groups"
name = "Task Groups"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Chrome-style task grouping, interactive multi-select fzf palette, and collapsible coordination"
platforms = ["linux", "macos"]

# Background daemon keeps group location badges and collapsed filters active
[[startup]]
command = ["./run.sh", "--watch"]

[[actions]]
id = "move-to-group"
title = "Move Agent to Task Group"
description = "Open interactive multi-select fzf palette to assign agents to task groups"
contexts = ["global", "pane"]
command = ["./run.sh", "open"]

[[panes]]
id = "group-palette"
title = "Move Agent to Group"
placement = "overlay"
command = ["./run.sh", "--pick-group"]

[[actions]]
id = "toggle-group"
title = "Toggle Task Group"
description = "Collapse or expand the focused agent task group"
contexts = ["global"]
command = ["./run.sh", "--toggle-group"]
